name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tailwind.css'
      - 'sw.js'
      - 'manifest.json'
      - 'icon-*.png'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Pre-flight: الملفات المطلوبة"
        run: |
          set -euo pipefail
          missing=""
          for f in index.html tailwind.css manifest.json package.json capacitor.config.json; do
            if [ ! -f "$f" ]; then missing="$missing $f"; else echo "✅ $f"; fi
          done
          if [ -n "$missing" ]; then echo "❌ ملفات مفقودة:$missing"; exit 1; fi

      - name: "Pre-flight: webDir = www"
        run: |
          set -euo pipefail
          if ! grep -qE '"webDir"\s*:\s*"www"' capacitor.config.json; then
            echo "❌ capacitor.config.json لا يحتوي \"webDir\": \"www\""
            cat capacitor.config.json
            exit 1
          fi
          echo "✅ webDir = www"

      - name: "Pre-flight: @capacitor/android مثبّت"
        run: |
          set -euo pipefail
          if ! grep -q '"@capacitor/android"' package.json; then
            echo "❌ @capacitor/android غير موجود في package.json"; exit 1
          fi
          echo "✅ @capacitor/android في package.json"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: "Pre-flight: تحقق فعلي من node_modules"
        run: |
          set -euo pipefail
          if [ ! -d "node_modules/@capacitor/android" ]; then
            echo "❌ node_modules/@capacitor/android مفقود بعد npm install"; exit 1
          fi
          echo "✅ node_modules/@capacitor/android موجود"

      - name: Prepare www (fully offline)
        run: |
          set -euo pipefail

          rm -rf www
          mkdir -p www

          for f in index.html tailwind.css manifest.json; do
            [ -f "$f" ] || { echo "❌ مفقود: $f"; exit 1; }
            cp "$f" www/
            echo "✅ نُسخ: $f"
          done

          for f in sw.js icon-192.png icon-512.png icon-maskable-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; echo "✅ نُسخ: $f"
            else echo "⚠️ اختياري مفقود: $f"; fi
          done

          mkdir -p www/vendor
          FONTS_CSS="www/vendor/fonts.css"
          if curl -fsSL --max-time 30 \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36' \
              'https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap' \
              -o "$FONTS_CSS"; then
            echo "✅ CSS الخطوط محمّل"
          else
            echo "⚠️ تعذّر التحميل — سيُستخدم خط النظام"
            : > "$FONTS_CSS"
          fi

          font_ok=0
          if [ -s "$FONTS_CSS" ]; then
            grep -oE 'https://fonts\.gstatic\.com/[^)]+\.woff2' "$FONTS_CSS" \
              | sort -u > /tmp/font_urls.txt || true
            while IFS= read -r url; do
              [ -z "$url" ] && continue
              fname=$(basename "$url")
              if curl -fsSL --max-time 30 "$url" -o "www/vendor/$fname"; then
                font_ok=$((font_ok + 1))
              else
                echo "⚠️ تعذّر: $fname"
              fi
            done < /tmp/font_urls.txt
            echo "✅ حُمِّل $font_ok ملف خط"
            sed -i -E 's|https://fonts\.gstatic\.com/[^)]+/([^/)]+)|./\1|g' "$FONTS_CSS"
          fi

          if [ -s "$FONTS_CSS" ]; then
            sed -i -E 's|<link [^>]*fonts\.googleapis\.com/css2[^>]*>|<link rel="stylesheet" href="./vendor/fonts.css">|' www/index.html
          fi

          font_refs=$(grep -c 'vendor/fonts.css' www/index.html || true)
          if [ "$font_refs" -eq 1 ]; then
            echo "✅ رابط الخطوط استُبدل بنجاح"
          elif [ "$font_refs" -eq 0 ]; then
            echo "⚠️ لم يُستبدل رابط الخطوط — سيعتمد التطبيق على خطوط النظام"
          else
            echo "❌ عدد غير متوقع من مراجع fonts.css: $font_refs"
            exit 1
          fi

          echo "══════ فحص الحزمة النهائية ══════"
          [ -f "www/tailwind.css" ] || { echo "❌ tailwind.css مفقود من www/"; exit 1; }
          echo "✅ tailwind.css موجود ($(du -h www/tailwind.css | cut -f1))"

          grep -q 'href="./tailwind.css"' www/index.html \
            || { echo "❌ index.html لا يشير إلى ./tailwind.css"; exit 1; }
          echo "✅ index.html يشير إلى ./tailwind.css"

          cdn_count=$(grep -c 'cdn\.tailwindcss\.com' www/index.html || true)
          echo "✅ إشارات cdn.tailwindcss.com: $cdn_count"
          if [ "$cdn_count" -gt 0 ]; then
            echo "❌ index.html ما زال يستدعي CDN"; exit 1
          fi

          echo "══════ محتوى www/ ══════"
          ls -la www/
          echo "══════ محتوى www/vendor/ ══════"
          ls -la www/vendor/ || true

      - name: Add Android platform (idempotent)
        run: |
          set -euo pipefail
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "✅ منصة android موجودة مسبقًا"
          fi

      - name: Customize Android project
        run: |
          set -euo pipefail
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">محاسبة النفس</string>|' "$STRINGS" || true
            sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">محاسبة النفس</string>|' "$STRINGS" || true
            echo "✅ اسم التطبيق محدَّث"
          fi

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            folder="android/app/src/main/res/mipmap-$d"
            [ -d "$folder" ] || continue
            if [ -f "icon-192.png" ]; then
              cp "icon-192.png" "$folder/ic_launcher.png" 2>/dev/null || true
              cp "icon-192.png" "$folder/ic_launcher_round.png" 2>/dev/null || true
            fi
            if [ -f "icon-512.png" ]; then
              cp "icon-512.png" "$folder/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done
          echo "✅ الأيقونات محدَّثة"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: "Post-build: تحقق من APK"
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] || { echo "❌ APK لم يُنتج"; exit 1; }
          echo "✅ APK جاهز: $(du -h "$APK" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muhasabah-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
