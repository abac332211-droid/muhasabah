name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare www with local Tailwind + Fonts
        run: |
          set -u
          mkdir -p www/vendor
          cp index.html www/
          cp sw.js www/ 2>/dev/null || echo "no sw.js"
          cp manifest.json www/ 2>/dev/null || echo "no manifest.json"
          cp icon-*.png www/ 2>/dev/null || echo "no icons"

          # 1) Tailwind Play CDN → ملف محلي
          curl -sL "https://cdn.tailwindcss.com" -o www/vendor/tailwind.js
          echo "✅ Tailwind: $(du -h www/vendor/tailwind.js | cut -f1)"

          # 2) Google Fonts CSS — UA حديث للحصول على woff2 فقط
          curl -sL \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36' \
            'https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap' \
            -o www/vendor/fonts.css
          echo "✅ Fonts CSS: $(du -h www/vendor/fonts.css | cut -f1)"

          # 3) استخرج روابط woff2 وحمّلها محليًا
          grep -oE 'https://fonts\.gstatic\.com/[^)]+\.woff2' www/vendor/fonts.css | sort -u > /tmp/font_urls.txt
          echo "✅ عدد ملفات الخطوط: $(wc -l < /tmp/font_urls.txt)"
          while IFS= read -r url; do
            fname=$(basename "$url")
            curl -sL "$url" -o "www/vendor/$fname"
          done < /tmp/font_urls.txt

          # 4) أعِد كتابة CSS ليستخدم الملفات المحلية
          sed -i -E 's|https://fonts\.gstatic\.com/[^)]+/([^/)]+)|./\1|g' www/vendor/fonts.css

          # 5) استبدل روابط CDN في index.html بالنسخ المحلية
          sed -i 's|<script src="https://cdn\.tailwindcss\.com"></script>|<script src="./vendor/tailwind.js"></script>|' www/index.html
          sed -i -E 's|<link href="https://fonts\.googleapis\.com/css2[^"]*" rel="stylesheet">|<link href="./vendor/fonts.css" rel="stylesheet">|' www/index.html

          # 6) تحقق من نجاح الاستبدال
          echo "---- التحقق من index.html ----"
          echo "Tailwind محلي: $(grep -c 'vendor/tailwind.js' www/index.html)"
          echo "Fonts محلي:    $(grep -c 'vendor/fonts.css' www/index.html)"

          echo "---- محتوى www/vendor ----"
          ls -la www/vendor/
          echo "---- محتوى www ----"
          ls -la www/

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Android project (اسم وأيقونات)
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">محاسبة النفس</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">محاسبة النفس</string>|' android/app/src/main/res/values/strings.xml

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            folder="android/app/src/main/res/mipmap-$d"
            if [ -d "$folder" ]; then
              cp icon-192.png "$folder/ic_launcher.png" 2>/dev/null || true
              cp icon-192.png "$folder/ic_launcher_round.png" 2>/dev/null || true
              cp icon-512.png "$folder/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done
          echo "Icons updated"
          ls -la android/app/src/main/res/mipmap-xxxhdpi/ || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muhasabah-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
