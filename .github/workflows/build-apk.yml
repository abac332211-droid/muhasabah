name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare www directory
        run: |
          mkdir -p www
          cp index.html www/
          cp sw.js www/ 2>/dev/null || echo "no sw.js"
          cp manifest.json www/ 2>/dev/null || echo "no manifest.json"
          cp icon-*.png www/ 2>/dev/null || echo "no icons"
          ls -la www/

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Android project (اسم وأيقونات)
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">محاسبة النفس</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">محاسبة النفس</string>|' android/app/src/main/res/values/strings.xml

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            folder="android/app/src/main/res/mipmap-$d"
            if [ -d "$folder" ]; then
              cp icon-192.png "$folder/ic_launcher.png" 2>/dev/null || true
              cp icon-192.png "$folder/ic_launcher_round.png" 2>/dev/null || true
              cp icon-512.png "$folder/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done
          echo "Icons updated"
          ls -la android/app/src/main/res/mipmap-xxxhdpi/ || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muhasabah-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
